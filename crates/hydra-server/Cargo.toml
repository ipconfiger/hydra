[package]
name = "hydra-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hydra I/O shell — Pingora proxy, sqlx store, reqwest auth. Thin adapter over hydra-core."

# W4: the `hydra` binary bootstraps the Pingora proxy server (design §15.1).
[[bin]]
name = "hydra"
path = "src/main.rs"
required-features = ["server"]

[features]
default = []

# Granular, composable feature set so each wave can compile its slice of the
# I/O shell WITHOUT pulling unrelated native deps (e.g. W2/W3 must build with
# only sqlx/reqwest and never touch pingora/BoringSSL on macOS).
#
# `dep:` syntax is used so enabling a feature does NOT auto-activate the dep
# under the same name (feature/dep decoupling).
#
# - `runtime`    : shared async-runtime helpers (tokio, dashmap, arc-swap,
#                  tracing, prometheus, thiserror, chrono, include_dir).
#                  Required by every I/O module.
# - `db`         : sqlx pool / migrations / repo (W2).
# - `http-client`: reqwest auth upstream (W3).
# - `proxy`      : pingora proxy shell + TLS (W4) — pulls BoringSSL.
# - `server`     : umbrella for full/W4+ builds (= db + http-client + proxy).
# - `usage-clickhouse`: optional ClickHouse usage sink (design §9.3).
runtime = [
    "dep:tokio",
    "dep:dashmap",
    "dep:arc-swap",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:prometheus",
    "dep:thiserror",
    "dep:chrono",
    "dep:include_dir",
]
db = ["runtime", "dep:sqlx"]
http-client = ["runtime", "dep:reqwest"]
proxy = ["runtime", "dep:pingora", "dep:pingora-proxy", "dep:pingora-core", "dep:pingora-http", "dep:rand", "dep:async-trait", "dep:bytes", "dep:http"]
server = ["db", "http-client", "proxy"]

# Optional usage sink (design §9.3). Off by default.
usage-clickhouse = ["dep:clickhouse"]

[dependencies]
# Always link the pure core.
hydra-core = { path = "../hydra-core" }

# --- Server runtime (gated behind `server`) -------------------------------
pingora = { version = "0.8", optional = true }
pingora-proxy = { version = "0.8", optional = true }
pingora-core = { version = "0.8", optional = true }
pingora-http = { version = "0.8", optional = true }
rand = { version = "0.8", optional = true }
async-trait = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
dashmap = { version = "6", optional = true }
arc-swap = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.1", optional = true }
prometheus = { version = "0.13", optional = true }
thiserror = { version = "1", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
include_dir = { version = "0.7", optional = true }

# --- Optional sink --------------------------------------------------------
clickhouse = { version = "0.1", optional = true }

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
